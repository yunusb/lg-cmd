name: Quality and dependency lock
on:
  push:
    branches: [main, ui-ux-wifi-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Unit tests, coverage, TypeScript and Expo versions
        run: npm run verify
      - name: Validate the actual Android JavaScript bundle
        run: npx expo export --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-lock
          path: package-lock.json
  commit_lock:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui-ux-wifi-v2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-ux-wifi-v2
      - uses: actions/download-artifact@v4
        with:
          name: verified-dependency-lock
      - name: Commit verified lock without triggering another build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock verified dependencies [skip ci] [eas skip]'
            git push origin HEAD:ui-ux-wifi-v2
          fi
