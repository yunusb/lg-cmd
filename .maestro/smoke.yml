appId: com.yunusb.lgcmd
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Trouver votre télévision"
    commands:
      - back
- assertVisible: "LG Remote"
- tapOn: "Chiffres"
- assertVisible: "1"
- assertVisible: "0"
- tapOn: "Fermer"
- tapOn: "Lecture"
- assertVisible: "Lire"
- tapOn: "Fermer"
- tapOn: "Plus"
- assertVisible: "Retour haptique"
- tapOn: "Fermer"
- takeScreenshot: remote-home
