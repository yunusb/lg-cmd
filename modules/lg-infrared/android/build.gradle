apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

// SDK 57 requires library version information during Expo autolinking.
group = 'expo.modules.lginfrared'
version = '1.0.1'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.lginfrared'
  defaultConfig {
    versionCode 1
    versionName '1.0.1'
  }
}

dependencies {
  // Explicit compile-time OkHttp dependency for the local-only SSAP adapter.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
